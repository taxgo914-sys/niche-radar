name: daily-niche-words

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: niche
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect
        run: python niche_finder.py --json-dir docs/data --out reports

      - name: Commit results
        run: |
          git config user.name  "niche-bot"
          git config user.email "niche-bot@users.noreply.github.com"
          git add niche.db docs/data reports
          git commit -m "data: $(date +%F)" || echo "no changes"
          git push
